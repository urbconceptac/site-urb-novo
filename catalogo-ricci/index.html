<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Ricci Boat — Visualizador</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { ink:'#0D0D0D', lime:'#CCFF00', g1:'#888888' },
  fontFamily: { sans:['Inter','sans-serif'] }
}}}
</script>
<style>
  html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden;font-family:'Inter',sans-serif;}
  
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  
  /* Palco centralizado proporcional a uma página dupla A5 retrato (1530x1080) */
  #stage{
    position:relative;
    width:1530px;
    height:1080px;
    flex:none;
    transform-origin:center center;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 35px 70px rgba(0,0,0,0.85);
    background: #000;
  }

  .spread{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .spread.active{opacity:1;pointer-events:auto;}
  
  /* Capa e Contracapa centralizadas na proporção de página única A5 (765x1080) */
  .page-single{width:765px;height:1080px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .page-single img{width:100%;height:100%;object-fit:fill;display:block;}

  /* Miolo com duas páginas retrato lado a lado (765x1080 cada) */
  .page-dual{width:765px;height:1080px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .page-dual img{width:100%;height:100%;object-fit:fill;display:block;}

  /* Barra de navegação flutuante fixa no rodapé */
  #nav{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    align-items:center;
    z-index:999;
    background:rgba(18,18,18,0.95);
    border:1px solid #2a2a2a;
    border-radius:999px;
    padding:8px 18px;
    color:#A0A0A0;
    font-size:14px;
    backdrop-filter:blur(8px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }
  #nav button{background:none;border:0;color:#fff;cursor:pointer;font-size:16px;padding:2px 8px;transition:color .2s;}
  #nav button:hover{color:#CCFF00;}
  .btn-pdf{background:#CCFF00;color:#0D0D0D;border:0;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:6px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .15s, background .15s;}
  .btn-pdf:hover{background:#b8e600;transform:scale(1.04);}
  .btn-pdf svg{width:13px;height:13px;fill:currentColor;}

  /* 
    IMPRESSÃO E PDF UNIFICADO (20 páginas A5 retrato individuais em sequência)
  */
  @media print{
    @page{size: 148mm 210mm;margin:0;}
    html,body{overflow:visible!important;height:auto!important;background:#000!important;}
    #viewport{position:static!important;display:block!important;}
    #stage{transform:none!important;width:auto!important;height:auto!important;margin:0!important;box-shadow:none!important;display:block!important;}
    .spread{position:relative!important;opacity:1!important;display:block!important;page-break-after:always!important;break-after:page!important;width:148mm!important;height:210mm!important;}
    .page-full, .page-single, .page-dual{width:148mm!important;height:210mm!important;page-break-after:always!important;break-after:page!important;display:block!important;}
    img{width:148mm!important;height:210mm!important;object-fit:fill!important;display:block!important;}
    #nav{display:none!important;}
  }
</style>
</head>
<body>
<div id="viewport"><div id="stage">

<!-- SPREAD 0: CAPA (Página 1) -->
<section class="spread active"><div class="page-single"><img src="images/Cat-Ricci-01.jpg" alt="Capa"></div></section>

<!-- SPREAD 1: Páginas 2 e 3 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-02.jpg" alt="Pág 2"></div><div class="page-dual"><img src="images/Cat-Ricci-03.jpg" alt="Pág 3"></div></section>

<!-- SPREAD 2: Páginas 4 e 5 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-04.jpg" alt="Pág 4"></div><div class="page-dual"><img src="images/Cat-Ricci-05.jpg" alt="Pág 5"></div></section>

<!-- SPREAD 3: Páginas 6 e 7 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-06.jpg" alt="Pág 6"></div><div class="page-dual"><img src="images/Cat-Ricci-07.jpg" alt="Pág 7"></div></section>

<!-- SPREAD 4: Páginas 8 e 9 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-08.jpg" alt="Pág 8"></div><div class="page-dual"><img src="images/Cat-Ricci-09.jpg" alt="Pág 9"></div></section>

<!-- SPREAD 5: Páginas 10 e 11 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-10.jpg" alt="Pág 10"></div><div class="page-dual"><img src="images/Cat-Ricci-11.jpg" alt="Pág 11"></div></section>

<!-- SPREAD 6: Páginas 12 e 13 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-12.jpg" alt="Pág 12"></div><div class="page-dual"><img src="images/Cat-Ricci-13.jpg" alt="Pág 13"></div></section>

<!-- SPREAD 7: Páginas 14 e 15 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-14.jpg" alt="Pág 14"></div><div class="page-dual"><img src="images/Cat-Ricci-15.jpg" alt="Pág 15"></div></section>

<!-- SPREAD 8: Páginas 16 e 17 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-16.jpg" alt="Pág 16"></div><div class="page-dual"><img src="images/Cat-Ricci-17.jpg" alt="Pág 17"></div></section>

<!-- SPREAD 9: Páginas 18 e 19 -->
<section class="spread"><div class="page-dual"><img src="images/Cat-Ricci-18.jpg" alt="Pág 18"></div><div class="page-dual"><img src="images/Cat-Ricci-19.jpg" alt="Pág 19"></div></section>

<!-- SPREAD 10: CONTRACAPA (Página 20) -->
<section class="spread"><div class="page-single"><img src="images/Cat-Ricci-20.jpg" alt="Contracapa"></div></section>

</div></div>

<div id="nav">
  <button id="prev" title="Anterior">←</button>
  <span id="count" style="font-weight:600; min-width:110px; text-align:center;">Capa (1)</span>
  <button id="next" title="Próximo">→</button>
  <button id="fs" title="Tela cheia">⛶</button>
  <div style="width:1px;height:16px;background:#333"></div>
  <button id="btnPdf" class="btn-pdf">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span>Baixar PDF</span>
  </button>
</div>

<script>
const spreads = [...document.querySelectorAll('.spread')];
const count = document.getElementById('count');
let i = 0;

const labels = [
  "Capa (1)",
  "Páginas 2 - 3",
  "Páginas 4 - 5",
  "Páginas 6 - 7",
  "Páginas 8 - 9",
  "Páginas 10 - 11",
  "Páginas 12 - 13",
  "Páginas 14 - 15",
  "Páginas 16 - 17",
  "Páginas 18 - 19",
  "Contracapa (20)"
];

function go(n) {
  i = Math.max(0, Math.min(spreads.length - 1, n));
  spreads.forEach((s, k) => s.classList.toggle('active', k === i));
  count.textContent = labels[i];
}

function fit() {
  const targetHeight = window.innerHeight * 0.65;
  const s = targetHeight / 1080;
  const st = document.getElementById('stage');
  st.style.transform = `scale(${s})`;
}

addEventListener('resize', fit);
fit();

document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => go(i + 1);
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById('btnPdf').onclick = () => window.print();

addEventListener('keydown', e => {
  if(['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(i + 1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)) { go(i - 1); }
  else if(e.key.toLowerCase() === 'f') document.getElementById('fs').click();
});
</script>
</body>
</html>
