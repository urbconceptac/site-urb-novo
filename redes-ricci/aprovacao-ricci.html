<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Urb Concept — Central de Aprovação de Conteúdo | Ricci Boat</title>
<meta name="robots" content="noindex, nofollow" />

<!-- Tipografia Coesa -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          background: "#0A0A0A",
          foreground: "#EDEDED",
          surface: "#111111",
          "surface-elevated": "#171717",
          muted: "#999999",
          subtle: "#555555",
          border: "#212121",
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"Roboto Mono"', 'ui-monospace', 'monospace'],
          display: ['"Space Grotesk"', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  body {
    background: #0A0A0A;
    color: #EDEDED;
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #EDEDED; color: #0A0A0A; }
  
  .label-mono {
    font-family: "Roboto Mono", monospace;
    font-size: 0.6875rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #737373;
  }
  
  .badge-tag {
    font-family: "Roboto Mono", monospace;
    font-size: 0.625rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid #262626;
    background: #141414;
    color: #9E9E9E;
    padding: 0.35rem 0.65rem;
  }

  .field {
    width: 100%;
    background: #141414;
    border: 1px solid #242424;
    padding: 0.85rem 1rem;
    font-size: 0.875rem;
    color: #fff;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .field:focus { border-color: #EDEDED; }
  .field::placeholder { color: #555555; }
  [hidden] { display: none !important; }
</style>
</head>
<body id="top">

<!-- HEADER -->
<header class="fixed inset-x-0 top-0 z-50 border-b border-border bg-background/90 backdrop-blur-md h-20">
  <div class="mx-auto flex h-full max-w-[1240px] items-center justify-between px-6">
    <a href="#top" class="flex items-center">
      <img src="logo-urb.png" alt="Urb Concept" width="80" height="80" class="h-14 w-14 object-contain" />
    </a>
    <div class="flex items-center gap-3">
      <span class="inline-block h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-mono text-xs text-muted uppercase tracking-wider">Ambiente de Aprovação</span>
    </div>
  </div>
</header>

<main class="pt-32 pb-24">
  <section class="mx-auto max-w-[900px] px-6">
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between border-b border-border pb-4 gap-4">
      <div>
        <span class="label-mono">Cliente / Projeto</span>
        <h1 class="font-display text-2xl font-normal tracking-tight text-white mt-1">Ricci Boat — Social Media</h1>
      </div>
      <button id="send-whatsapp-summary" class="bg-emerald-600 hover:bg-emerald-500 text-black font-mono text-xs uppercase px-4 py-2.5 font-bold transition-colors flex items-center gap-2">
        <span>Enviar Resumo para o WhatsApp ➔</span>
      </button>
    </div>

    <!-- GRADE DO INSTAGRAM -->
    <div class="border border-border bg-surface p-6 sm:p-8">
      <div class="flex items-center gap-4 sm:gap-8 pb-8 border-b border-border">
        <div class="h-20 w-20 sm:h-24 sm:w-24 rounded-full border border-border bg-surface-elevated flex items-center justify-center overflow-hidden">
          <img src="ricci-boat-logo.png" alt="Ricci Boat Logo" class="h-full w-full object-cover" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%23111%22/><text x=%2250%%22 y=%2250%%22 fill=%22%23fff%22 font-size=%2214%22 font-family=%22monospace%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>RB</text></svg>';" />
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-4 flex-wrap">
            <h2 class="font-display text-lg font-medium">ricciboat</h2>
            <span class="badge-tag bg-white/10 text-white border-transparent">Estética Náutica & Refit</span>
          </div>
          <p class="text-xs sm:text-sm text-muted mt-2">Clique nas miniaturas para revisar, passar os carrosséis, aprovar e deixar comentários.</p>
        </div>
      </div>

      <div class="flex justify-center border-b border-border mb-6">
        <button class="flex items-center gap-2 py-3 px-6 border-b-2 border-white text-white font-mono text-xs uppercase tracking-widest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Lote Atual de Publicações
        </button>
      </div>

      <div id="instagram-grid" class="grid grid-cols-3 gap-1 sm:gap-2"></div>
    </div>
  </section>
</main>

<!-- FOOTER -->
<footer class="border-t border-border py-12">
  <div class="mx-auto flex max-w-[1240px] items-center justify-between px-6">
    <img src="logo-urb.png" alt="Símbolo Urb Concept" width="60" height="60" class="h-12 w-12 object-contain opacity-75" />
    <p class="label-mono">© Urb Concept. Todos os direitos reservados.</p>
  </div>
</footer>

<!-- MODAL -->
<div id="post-modal" hidden class="fixed inset-0 z-[90] flex items-center justify-center bg-black/90 p-4 backdrop-blur-md">
  <div id="post-modal-content" class="relative w-full max-w-4xl border border-border bg-surface overflow-hidden flex flex-col md:flex-row max-h-[90vh]"></div>
</div>

<div id="toast" hidden class="fixed bottom-8 right-6 z-[100] max-w-xs border border-border bg-surface-elevated p-4 text-sm text-white shadow-xl"></div>

<script>
(function () {
  "use strict";

  /* ---------- DADOS DOS POSTS (Post 01 embaixo até Post 08 no topo) ---------- */
  var instagramPosts = [
    {
      id: "post-1",
      type: "static",
      title: "Post 01",
      caption: "Seja em vagas molhadas, secas ou na garagem residencial do seu condomínio. A Ricci Boat leva uma operação estruturada até a sua embarcação.\n\nNossa equipe executa os serviços de estética e refit presencialmente, garantindo que o seu patrimônio receba o tratamento adequado sem que você precise se preocupar com a logística de deslocamento.\n\n#ricciboat #nautica #esteticanautica",
      image: "Estáticos/Ricci_Post_1.png",
      approved: false,
      comments: []
    },
    {
      id: "post-2",
      type: "carousel",
      title: "Post 02 (Carrossel)",
      caption: "A manutenção do seu barco precisa acompanhar o seu nível de exigência.\n\nLavagens rápidas não resolvem a contaminação acumulada em áreas críticas. Estruturamos nossos serviços de higienização detalhada para entregar o perfeccionismo que você espera ao pisar na cabine.\n\nAgende uma avaliação da sua embarcação.\n\n#higienizacaonautica #detalhamentonautico #lanchasbrasil #cuidadoscomobarco",
      images: [
        "Carrossel/Ricci_Post_2/Carrossel_5_lmns_01.jpg",
        "Carrossel/Ricci_Post_2/Carrossel_5_lmns_02.jpg",
        "Carrossel/Ricci_Post_2/Carrossel_5_lmns_03.jpg",
        "Carrossel/Ricci_Post_2/Carrossel_5_lmns_04.jpg",
        "Carrossel/Ricci_Post_2/Carrossel_5_lmns_05.jpg"
      ],
      approved: false,
      comments: []
    },
    {
      id: "post-3",
      type: "static",
      title: "Post 03",
      caption: "A madeira teca exige um protocolo de cuidado rigoroso. Produtos incorretos e técnicas amadoras ressecam a fibra e comprometem a durabilidade do convés.\n\nA Ricci Boat realiza a restauração completa da teca, utilizando métodos que preservam a integridade do material e devolvem o acabamento original da sua embarcação. Um portfólio abrangente executado por quem entende de engenharia náutica.\n\n#tecanautica #refitnautico #nauticapaulista #ricciboat",
      image: "Estáticos/Ricci_Post_3.png",
      approved: false,
      comments: []
    },
    {
      id: "post-4",
      type: "static",
      title: "Post 04",
      caption: "A experiência de navegar não deve ser ofuscada pela preocupação com a limpeza prévia ou manutenção estética.\n\nNossa equipe atua em duplas altamente qualificadas, utilizando produtos diferenciados para entregar o seu barco pronto para o uso. Você foca no passeio; nós garantimos que a embarcação esteja impecável.\n\n#vidanautica #navegacao #lanchas #marineestetica",
      image: "Estáticos/Ricci_Post_4.png",
      approved: false,
      comments: []
    },
    {
      id: "post-5",
      type: "static",
      title: "Post 05",
      caption: "O acúmulo de sujidade no casco prejudica o desempenho e a estética da sua lancha. A remoção do fundo precisa ser feita com produtos e técnicas que preservem a camada de gelcoat, sem causar desgaste prematuro.\n\nTrabalhamos com processos seguros e eficientes para garantir que o casco da sua embarcação mantenha a integridade e o deslize perfeito na água.\n\n#casconautico #gelcoat #manutencaonautica",
      image: "Estáticos/Ricci_Post_5.png",
      approved: false,
      comments: []
    },
    {
      id: "post-6",
      type: "carousel",
      title: "Post 06 (Carrossel)",
      caption: "O cuidado com o seu barco não aceita tentativa e erro.\n\nA Ricci Boat entrega serviços de polimento, higienização e refit com equipes qualificadas, atuando diretamente nas represas e rios do interior paulista. Evite surpresas e proteja o valor de revenda da sua lancha.\n\nFale com nossa equipe para detalhar os serviços disponíveis na sua região.\n\n#polimentonautico #revendadebarcos #nauticainterior #ricciboat",
      images: [
        "Carrossel/Ricci_Post_6/Carrossel_5_lmns_01.jpg",
        "Carrossel/Ricci_Post_6/Carrossel_5_lmns_02.jpg",
        "Carrossel/Ricci_Post_6/Carrossel_5_lmns_03.jpg",
        "Carrossel/Ricci_Post_6/Carrossel_5_lmns_04.jpg",
        "Carrossel/Ricci_Post_6/Carrossel_5_lmns_05.jpg"
      ],
      approved: false,
      comments: []
    },
    {
      id: "post-7",
      type: "static",
      title: "Post 07",
      caption: "A necessidade da sua lancha muda conforme o uso e o tempo parada. Por isso, reclassificamos nossos serviços para entregar exatamente o que você precisa.\n\nDo serviço básico de lavagem, com alta pressão e aplicação de cera, até a higienização detalhada, que engloba a limpeza profunda de duas suítes e remoção completa de contaminações. O nível de cuidado se adapta ao tamanho do seu barco e à sua exigência.\n\n#higienizacaodebarcos #detalhamentoautomotivo #nauticabr",
      image: "Estáticos/Ricci_Post_7.png",
      approved: false,
      comments: []
    },
    {
      id: "post-8",
      type: "static",
      title: "Post 08",
      caption: "O mercado náutico é movido por parcerias e confiança. Nós trabalhamos em conjunto com marinheiros e gestores de marinas para garantir que a execução do nosso serviço não interfira na rotina do local, somando forças para entregar o melhor resultado final.\n\nSeja para uma lavagem de rotina ou um polimento técnico complexo, a Ricci Boat é a estrutura que faltava para a manutenção da sua embarcação no interior de São Paulo.\n\n#marinas #nauticasp #lanchasbrasil",
      image: "Estáticos/Ricci_Post_8.png",
      approved: false,
      comments: []
    }
  ];

  var displayPosts = instagramPosts.slice().reverse();

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var gridContainer = document.getElementById("instagram-grid");

  function renderGrid() {
    gridContainer.innerHTML = displayPosts.map(function (post, idx) {
      var thumb = post.type === 'carousel' ? post.images[0] : post.image;
      var badge = post.type === 'carousel' ? '<div class="absolute top-2 right-2 bg-black/70 p-1.5 rounded text-white z-10"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-3.5 w-3.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>' : '';
      var approvalStatus = post.approved 
        ? '<div class="absolute bottom-2 left-2 bg-emerald-500/90 text-black text-[10px] font-mono uppercase px-2 py-0.5 font-bold z-10">Aprovado</div>' 
        : '';

      return '<button type="button" data-post-id="' + post.id + '" class="group relative aspect-square w-full overflow-hidden bg-surface-elevated border border-border transition-transform hover:opacity-95">' +
        '<img src="' + esc(thumb) + '" alt="' + esc(post.title) + '" loading="lazy" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%23161616%22/><text x=%2250%%22 y=%2250%%22 fill=%22%23666%22 font-size=%2210%22 font-family=%22monospace%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>Erro Imagem</text></svg>\';" />' +
        badge +
        approvalStatus +
        '<div class="absolute inset-0 bg-black/40 opacity-0 transition-opacity group-hover:opacity-100 flex items-center justify-center text-white font-mono text-xs z-20">' +
          '<span>Ver Peça ↗</span>' +
        '</div>' +
      '</button>';
    }).join("");

    gridContainer.querySelectorAll("[data-post-id]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = this.getAttribute("data-post-id");
        var realIndex = instagramPosts.findIndex(function(p) { return p.id === id; });
        openModal(realIndex);
      });
    });
  }

  renderGrid();

  var modal = document.getElementById("post-modal");
  var modalContent = document.getElementById("post-modal-content");

  function openModal(index) {
    var post = instagramPosts[index];
    var currentSlide = 0;

    var visualArea = "";
    if (post.type === "carousel") {
      visualArea = '<div class="relative w-full md:w-3/5 bg-black flex items-center justify-center overflow-hidden group aspect-[4/5]">' +
        '<div id="carousel-inner" class="flex h-full w-full transition-transform duration-300 ease-out">' +
          post.images.map(function(img, imgIdx) {
            return '<div class="min-w-full h-full flex-shrink-0 flex items-center justify-center relative">' +
              '<img src="' + esc(img) + '" alt="Slide ' + (imgIdx + 1) + '" class="h-full w-full object-contain" />' +
              '<span class="absolute top-4 left-4 bg-black/70 text-white font-mono text-xs px-2.5 py-1">Slide ' + (imgIdx + 1) + '/' + post.images.length + '</span>' +
            '</div>';
          }).join("") +
        '</div>' +
        '<button type="button" id="prev-slide" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/70 text-white p-2 rounded-full hover:bg-black">❮</button>' +
        '<button type="button" id="next-slide" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/70 text-white p-2 rounded-full hover:bg-black">❯</button>' +
      '</div>';
    } else {
      visualArea = '<div class="relative w-full md:w-3/5 bg-black flex items-center justify-center aspect-[4/5]">' +
        '<img src="' + esc(post.image) + '" alt="' + esc(post.title) + '" class="h-full w-full object-contain" />' +
      '</div>';
    }

    var commentsHtml = post.comments.length > 0 
      ? post.comments.map(function(c) {
          return '<div class="bg-background p-2.5 border border-border text-xs mt-2"><p class="text-muted">' + esc(c) + '</p></div>';
        }).join("")
      : '<p class="text-xs text-muted italic">Nenhum comentário ou ajuste solicitado ainda.</p>';

    modalContent.innerHTML = 
      '<button type="button" id="modal-close" class="absolute right-4 top-4 z-20 flex h-8 w-8 items-center justify-center bg-background/80 text-white border border-border hover:bg-white hover:text-black transition-colors">✕</button>' +
      visualArea +
      '<div class="w-full md:w-2/5 flex flex-col justify-between p-6 bg-surface overflow-y-auto max-h-[90vh]">' +
        '<div>' +
          '<div class="flex items-center justify-between border-b border-border pb-4">' +
            '<span class="label-mono">' + esc(post.title) + '</span>' +
            '<span class="badge-tag ' + (post.approved ? 'bg-emerald-500 text-black border-emerald-500 font-bold' : '') + '">' + (post.approved ? 'Aprovado' : 'Pendente') + '</span>' +
          '</div>' +
          '<p class="text-xs text-foreground mt-4 leading-relaxed whitespace-pre-line">' + esc(post.caption) + '</p>' +
          '<div class="mt-6 border-t border-border pt-4">' +
            '<p class="label-mono mb-2">Comentários e Ajustes</p>' +
            '<div class="max-h-32 overflow-y-auto" id="comments-list">' + commentsHtml + '</div>' +
            '<div class="mt-3 flex gap-2">' +
              '<input type="text" id="comment-input" placeholder="Ex: Ajustar cor..." class="field text-xs py-2" />' +
              '<button type="button" id="send-comment" class="btn-ghost px-3 text-xs border border-border bg-surface-elevated text-white hover:border-white">Enviar</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="mt-8 pt-4 border-t border-border">' +
          '<button type="button" id="toggle-approve" class="w-full py-3 text-xs uppercase tracking-wider font-mono font-medium transition-colors ' + 
            (post.approved ? 'bg-surface-elevated text-white border border-border hover:border-red-500' : 'bg-emerald-500 text-black hover:bg-emerald-400') + '">' +
            (post.approved ? 'Desfazer Aprovação' : 'Aprovar Peça ✓') +
          '</button>' +
        '</div>' +
      '</div>';

    modal.hidden = false;
    document.body.style.overflow = "hidden";

    if (post.type === "carousel") {
      var track = document.getElementById("carousel-inner");
      document.getElementById("next-slide").addEventListener("click", function() {
        currentSlide = (currentSlide + 1) % post.images.length;
        track.style.transform = "translateX(-" + (currentSlide * 100) + "%)";
      });
      document.getElementById("prev-slide").addEventListener("click", function() {
        currentSlide = (currentSlide - 1 + post.images.length) % post.images.length;
        track.style.transform = "translateX(-" + (currentSlide * 100) + "%)";
      });
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    
    document.getElementById("toggle-approve").addEventListener("click", function() {
      post.approved = !post.approved;
      showToast(post.approved ? "Peça aprovada com sucesso!" : "Aprovação revertida", post.title);
      renderGrid();
      openModal(index);
    });

    document.getElementById("send-comment").addEventListener("click", function() {
      var input = document.getElementById("comment-input");
      var val = input.value.trim();
      if (val) {
        post.comments.push(val);
        input.value = "";
        showToast("Comentário adicionado", "Registrado com sucesso.");
        openModal(index);
      }
    });
  }

  function closeModal() {
    modal.hidden = true;
    modalContent.innerHTML = "";
    document.body.style.overflow = "";
  }

  modal.addEventListener("click", function(e) {
    if (e.target === modal) closeModal();
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && !modal.hidden) closeModal();
  });

  /* ---------- COPIA O RESUMO PARA A ÁREA DE TRANSFERÊNCIA E ABRE O WHATSAPP ---------- */
  document.getElementById("send-whatsapp-summary").addEventListener("click", function() {
    var WHATSAPP_NUMBER = "5511982684426";
    var summary = ["*Relatório de Aprovação — Ricci Boat*", ""];
    
    instagramPosts.forEach(function(p, i) {
      var status = p.approved ? "✅ Aprovado" : "⏳ Pendente";
      summary.push((i + 1) + ". " + p.title + " — " + status);
      if (p.comments.length > 0) {
        summary.push("   Comentários: " + p.comments.join(" | "));
      }
    });

    summary.push("");
    summary.push("Enviado através da Central de Aprovação Urb Concept.");

    var text = summary.join("\n");

    // Copia para a área de transferência do usuário para garantir que nada se perca
    navigator.clipboard.writeText(text).then(function() {
      showToast("Relatório copiado!", "Cole no chat do WhatsApp (Ctrl+V)");
    }).catch(function() {
      console.log("Copiado manualmente");
    });

    // Abre o WhatsApp Web com o texto codificado
    var url = "https://api.whatsapp.com/send?phone=" + WHATSAPP_NUMBER + "&text=" + encodeURIComponent(text);
    window.open(url, "_blank", "noopener,noreferrer");
  });

  function showToast(title, desc) {
    var toast = document.getElementById("toast");
    toast.innerHTML = '<p class="font-mono text-[11px] uppercase tracking-[0.16em] text-white">' + esc(title) + '</p>' +
      '<p class="mt-1 text-xs text-muted">' + esc(desc) + '</p>';
    toast.hidden = false;
    setTimeout(function() { toast.hidden = true; }, 4000);
  }

})();
</script>
</body>
</html>
